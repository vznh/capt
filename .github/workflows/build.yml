name: Build Capt

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CAPT_SIGN_IDENTITY: '-'
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test release metadata
        run: python3 -m unittest discover -s Tests/Release -v

      - name: Check Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26

      - name: Build and package
        run: Scripts/package.sh local

      - name: Verify downloads
        run: |
          codesign --verify --deep --strict build/Capt.app
          test "$(lipo -archs build/Capt.app/Contents/MacOS/Capt)" = arm64
          cd build/packages
          shasum -a 256 -c ./*.sha256
          for archive in ./*.zip; do unzip -tq "$archive"; done
          for disk_image in ./*.dmg; do hdiutil verify "$disk_image"; done

      - name: Record source and build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'master' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'Pull request: %s\n' "$PR_NUMBER"
            printf 'PR head commit: %s\n' "$HEAD_SHA"
            printf 'Tested merge commit: %s\n' "$MERGE_SHA"
            printf 'Build: %s\n' "$RUN_URL"
            printf 'Requirements: Apple Silicon, macOS 26 or newer\n'
            printf 'Signing: ad-hoc; not notarized by Apple\n'
          } > build/packages/BUILD.txt

      - name: Upload preview downloads
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Capt-preview-${{ github.event.pull_request.number || 'master' }}-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: build/packages/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Link to preview downloads
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '[Download preview build](%s) (GitHub sign-in required).\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Contains a DMG, ZIP, checksums, and BUILD.txt. Apple Silicon, macOS 26+. Ad-hoc signed; not notarized.\n' >> "$GITHUB_STEP_SUMMARY"
