name: Package Capt

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: package-${{ github.ref }}-${{ github.ref_type == 'branch' && github.run_id || 'release' }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CAPT_SIGN_IDENTITY: '-'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test release metadata
        run: python3 -m unittest discover -s Tests/Release -v

      - name: Prepare release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci-release.py

      - name: Check Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26

      - name: Build and package
        run: Scripts/package.sh local

      - name: Verify downloads
        run: |
          codesign --verify --deep --strict build/Capt.app
          test "$(lipo -archs build/Capt.app/Contents/MacOS/Capt)" = arm64
          cd build/packages
          shasum -a 256 -c ./*.sha256
          for archive in ./*.zip; do unzip -tq "$archive"; done
          for disk_image in ./*.dmg; do hdiutil verify "$disk_image"; done

      - name: Record source and build
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'Source commit: %s\n' "$SOURCE_SHA"
            printf 'Build: %s\n' "$RUN_URL"
            printf 'Requirements: Apple Silicon, macOS 26 or newer\n'
            printf 'Signing: ad-hoc; not notarized by Apple\n'
          } > build/packages/BUILD.txt

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Capt-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: build/packages/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish release downloads
        id: publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          body_path: .release-notes.md
          draft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          generate_release_notes: ${{ steps.release.outputs.generate_notes }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            build/packages/*.dmg
            build/packages/*.zip
            build/packages/*.sha256
            build/packages/BUILD.txt

      - name: Link to downloads
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          printf 'Download: %s\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
